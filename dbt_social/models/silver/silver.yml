version: 2

models:
  - name: dim_account
    description: "Conformed Social Media ad account dimension (Meta, TikTok, Snapchat)."
    columns:
      - name: account_sk
        description: "Unique account surrogate key (platform + account_id)."
        tests:
          - not_null
          - unique
      - name: client_id
        description: "Publicis Media France advertiser identifier."
        tests:
          - not_null

  - name: dim_campaign_scd2
    description: "Conformed Social campaign dimension in SCD Type 2 (tracks changes to campaign name, objective, and status over time)."
    columns:
      - name: campaign_scd_sk
        description: "Versioned surrogate key (platform + campaign_id + scd_version)."
        tests:
          - not_null
          - unique
      - name: campaign_id
        description: "Native campaign identifier from the ad platform."
        tests:
          - not_null
      - name: scd_version
        description: "SCD2 version sequence number (1, 2, ...)."
        tests:
          - not_null
      - name: valid_from
        description: "Effective start date of this campaign version."
        tests:
          - not_null
      - name: valid_to
        description: "Effective end date (NULL for the active version)."
      - name: is_current
        description: "Flag indicating whether this campaign version is currently active."
        tests:
          - not_null

  - name: fct_social_performance_daily
    description: "Unified Silver Social Media daily fact table normalized to EUR and enriched with Publicis media taxonomy. Strict grain: (date_day, platform, account_id, campaign_id, adset_id)."
    tests:
      - unique_combination_of_columns:
          combination_of_columns:
            - date_day
            - platform
            - account_id
            - campaign_id
            - adset_id
    columns:
      - name: social_perf_sk
        description: "Deterministic surrogate key for the Silver fact grain."
        tests:
          - not_null
          - unique
      - name: date_day
        description: "Daily delivery date (BigQuery partition key)."
        tests:
          - not_null
      - name: platform
        description: "Normalized Paid Social platform (meta, tiktok, snapchat)."
        tests:
          - not_null
          - accepted_values:
              values: ['meta', 'tiktok', 'snapchat']
      - name: client_id
        description: "Publicis advertiser identifier (clustering & RLS key)."
        tests:
          - not_null
      - name: spend_eur
        description: "Media spend normalized to EUR via ref.ref_fx_rates."
        tests:
          - not_null
      - name: impressions
        description: "Total ad impressions."
        tests:
          - not_null
      - name: clicks
        description: "Unified clicks metric (Meta link_clicks, TikTok clicks, Snapchat swipes)."
        tests:
          - not_null
