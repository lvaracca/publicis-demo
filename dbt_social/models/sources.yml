version: 2

sources:
  - name: ref
    database: publicis-demo-515613
    schema: ref
    description: "Publicis Media France versioned canonical reference tables"
    tables:
      - name: ref_fx_rates
        description: "Daily foreign exchange conversion rates to EUR"
      - name: ref_media_taxonomy
        description: "Canonical media taxonomy reference (brands, objectives, funnels)"
      - name: ref_clients_rls
        description: "Client-level Row-Level Security (RLS) configuration table"

  - name: bronze
    database: publicis-demo-515613
    schema: bronze
    description: "Raw Bronze layer ingested from Adverity (GCS -> BigQuery)"
    tables:
      - name: brz_meta_ads
        description: "Raw Meta Ads performance data (Facebook / Instagram)"
        loaded_at_field: _ingested_at
        freshness:
          warn_after: { count: 24, period: hour }
          error_after: { count: 48, period: hour }
          filter: "report_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY)"
      - name: brz_tiktok_ads
        description: "Raw TikTok Ads performance data"
        loaded_at_field: _ingested_at
        freshness:
          warn_after: { count: 24, period: hour }
          error_after: { count: 48, period: hour }
          filter: "report_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY)"
      - name: brz_snapchat_ads
        description: "Raw Snapchat Ads performance data (micro-USD spend, swipes -> clicks)"
        loaded_at_field: _ingested_at
        freshness:
          warn_after: { count: 24, period: hour }
          error_after: { count: 48, period: hour }
          filter: "report_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY)"
