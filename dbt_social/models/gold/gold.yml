version: 2

models:
  - name: dp_social_performance
    description: >
      Certified Gold Data Product (Publicis Media France) — Daily multi-platform Paid Social performance (Meta, TikTok, Snapchat).
      Protected by Row-Level Security on client_id.
      Canonical KPI definitions:
      CTR (Click-Through Rate) = SAFE_DIVIDE(SUM(clicks), SUM(impressions)) (NEVER AVG).
      CPM EUR = SAFE_DIVIDE(SUM(spend_eur), SUM(impressions)) * 1000.
      CPC EUR = SAFE_DIVIDE(SUM(spend_eur), SUM(clicks)).
    columns:
      - name: date_day
        description: "Daily delivery date (YYYY-MM-DD)."
        tests:
          - not_null
      - name: client_id
        description: "Technical advertiser identifier (maison_eclat, autonova_fr). Enforced by RLS."
        tests:
          - not_null
      - name: client_name
        description: "Display advertiser name (Maison Éclat, AutoNova France)."
      - name: platform
        description: "Social media platform: meta, tiktok, snapchat."
        tests:
          - not_null
      - name: campaign_id
        description: "Unique platform campaign identifier."
      - name: campaign_name
        description: "Campaign name following Publicis canonical taxonomy."
      - name: campaign_objective
        description: "Campaign media objective (AWARENESS, TRAFFIC, CONVERSION), historized via SCD2."
      - name: campaign_scd_version
        description: "Active SCD2 campaign version on date_day."
      - name: brand_name
        description: "Advertiser brand display name (parsed from taxonomy)."
      - name: funnel_stage
        description: "Marketing funnel stage: UPPER, MID, LOWER, UNKNOWN."
      - name: spend_eur
        description: "Media spend in Euros (EUR). Additive: use SUM(spend_eur)."
        tests:
          - not_null
      - name: impressions
        description: "Ad impressions count. Additive: use SUM(impressions). Denominator of CTR."
        tests:
          - not_null
      - name: clicks
        description: "Unified clicks/swipes count. Additive: use SUM(clicks). Numerator of CTR = SAFE_DIVIDE(SUM(clicks), SUM(impressions))."
        tests:
          - not_null
      - name: video_views
        description: "Total video views."
      - name: conversions
        description: "Attributed conversions / purchases."
