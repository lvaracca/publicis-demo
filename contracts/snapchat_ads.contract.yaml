apiVersion: v3.0.1
kind: DataContract
id: urn:publicis:social:snapchat_ads:v1
version: "1.1.0"
status: active
domain: social
dataProduct: dp_social_performance

info:
  title: "Snapchat Ads Raw Ingestion Contract"
  description: "Adverity -> GCS -> BigQuery Bronze ingestion contract for Snapchat Ads. Profiled from the 2026-11-23 CSV sample."
  owner: "team-data-engineering@publicismedia.fr"
  steward: "paid-social-ops@publicismedia.fr"
  sourceSystem: "Adverity (Snapchat Marketing API)"

servers:
  landing:
    type: gcs
    location: "gs://publicis-demo-515613-landing/adverity/snapchat_ads/"
    format: csv
  bronze:
    type: bigquery
    project: publicis-demo-515613
    dataset: bronze
    table: "brz_snapchat_ads"
    location: europe-west1

ingestion:
  writeDisposition: WRITE_APPEND_MERGE
  partitionBy: report_date
  clusterBy: [client_id, campaign_id]
  requirePartitionFilter: true
  schemaEvolutionPolicy: STRICT_CONTRACT_CHECK

sla:
  freshnessHours: 24
  deliveryTimeCET: "07:00"
  availabilityTarget: "99.5%"

security:
  piiDetected: false
  dlpClassification: INTERNAL_MEDIA_METRICS
  accessControl: "Keyless IAM - Data Engineering SA only (NO direct agent/BI access)"

finops:
  costCenter: publicis_media_fr
  gcsNearlineDays: 90
  gcsDeleteDays: 365
  bqPartitionExpirationDays: 730
  labels:
    env: dev
    domain: social
    source: snapchat_ads
    managed_by: terraform

schema:
  primaryKey: [report_date, account_id, campaign_id, ad_squad_id]
  columns:
    - { name: report_date, type: DATE, nullable: false, description: "Daily delivery date" }
    - { name: client_id, type: STRING, nullable: false, description: "Publicis advertiser identifier" }
    - { name: account_id, type: STRING, nullable: false, description: "Snapchat ad account ID" }
    - { name: account_name, type: STRING, nullable: false, description: "Snapchat ad account name" }
    - { name: campaign_id, type: STRING, nullable: false, description: "Snapchat campaign ID" }
    - { name: campaign_name, type: STRING, nullable: false, description: "Campaign name (Publicis taxonomy)" }
    - { name: campaign_objective, type: STRING, nullable: false, description: "Campaign objective (AWARENESS, TRAFFIC, CONVERSION)" }
    - { name: campaign_status, type: STRING, nullable: false, description: "Campaign status (ACTIVE, PAUSED)" }
    - { name: ad_squad_id, type: STRING, nullable: false, description: "Ad Squad ID (equivalent to Ad Set)" }
    - { name: ad_squad_name, type: STRING, nullable: false, description: "Ad Squad name" }
    - { name: currency, type: STRING, nullable: false, description: "Source currency (USD -> converted to EUR in Silver)" }
    - { name: spend_micro, type: INT64, nullable: false, description: "Spend in micro-currency units (divide by 1,000,000)" }
    - { name: impressions, type: INT64, nullable: false, description: "Number of impressions" }
    - { name: swipes, type: INT64, nullable: false, description: "Number of swipes (mapped to clicks in Silver)" }
    - { name: video_views, type: INT64, nullable: true, description: "Number of video views" }
    - { name: purchases, type: INT64, nullable: true, description: "Number of purchases (mapped to conversions in Silver)" }
    - { name: view_through_conversions, type: INT64, nullable: true, description: "Post-view conversions added in v1.1.0 (additive non-breaking)" }
    - { name: _ingested_at, type: TIMESTAMP, nullable: false, description: "Technical Bronze ingestion timestamp" }
    - { name: _source_file, type: STRING, nullable: false, description: "Source Adverity GCS file URI" }

qualityRules:
  - id: dq_no_duplicates
    type: uniqueness
    columns: [report_date, account_id, campaign_id, ad_squad_id]
    severity: ERROR
  - id: dq_freshness
    type: freshness
    maxAgeHours: 24
    severity: WARN
  - id: dq_spend_non_negative
    type: expression
    expression: "spend_micro >= 0"
    severity: ERROR
  - id: dq_no_swipes_without_impressions
    type: expression
    expression: "NOT (impressions = 0 AND swipes > 0)"
    severity: WARN
